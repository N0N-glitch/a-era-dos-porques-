<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Era dos Porquês</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="cena">
    <h1>&gt; A_ERA_DOS_PORQUÊS</h1>

    <section id="placar">
      <div>PONTOS: <span id="pontos">0</span></div>
      <div id="progresso"></div>
      <div class="medidor-wrap">
        <span>CONSCIÊNCIA: <span id="consciencia-valor">50</span>/100</span>
        <div class="medidor"><div id="medidor-barra"></div></div>
      </div>
    </section>

    <section id="jogo">
      <!--
        ============================================================
        FASE VISUAL FUTURA
        Este bloco é só um placeholder de texto. Na etapa de arte,
        o personagem (criança) e os cenários entram aqui, junto com
        o acabamento visual refinado. A lógica não depende dele.
        ============================================================
      -->
      <div id="personagem" class="placeholder"></div>

      <!-- Caixa de diálogo: a pergunta da criança aparece digitada -->
      <div id="dialogo" aria-live="polite">
        <div class="falante">CRIANÇA:</div>
        <p id="dialogo-texto" class="fala"></p>
        <div class="dica" id="dica-pular">(toque na caixa para pular a digitação)</div>
      </div>

      <!-- Eco da resposta do jogador -->
      <div id="eco" hidden></div>

      <!-- Reação da criança + pontuação -->
      <div id="feedback" hidden>
        <div id="feedback-meta"></div>
        <div class="falante">CRIANÇA:</div>
        <p id="feedback-texto" class="fala"></p>
      </div>

      <!-- Resposta livre do jogador -->
      <div id="resposta">
        <label for="texto-livre">&gt; Sua resposta:</label>
        <textarea id="texto-livre" rows="3" placeholder="explique para a criança..."></textarea>
        <div id="aviso" role="status"></div>
        <button id="btn-enviar" type="button">ENVIAR</button>
      </div>

      <button id="btn-continuar" type="button" hidden>CONTINUAR &gt;</button>
    </section>

    <section id="fim" hidden>
      <h2 id="fim-titulo"></h2>
      <p id="fim-texto"></p>
      <p id="fim-stats"></p>
      <button id="btn-reiniciar" type="button">JOGAR NOVAMENTE</button>
    </section>
  </main>

  <script src="dados.js"></script>
  <script src="motor.js"></script>
  <script src="ui.js"></script>
</body>
</html>
